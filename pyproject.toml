# Tooling config only. Runtime deps live in requirements*.txt for readability.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # make `import app...` work no matter where pytest is invoked
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
